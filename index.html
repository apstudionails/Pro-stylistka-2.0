</head>
<body>
  <main class="page-shell">
    <!-- Nagłówek z pieczęcią AP STUDIO i nazwą programu -->
    <header class="top-brand">
      <div class="brand-seal" aria-hidden="true">
        <span class="ap">AP</span>
        <span class="studio">STUDIO</span>
      </div>
      <h1>PRO STYLISTKA 2.0</h1>
      <div class="form-tag">FORMULARZ ZGŁOSZENIOWY</div>
    </header>

    <!-- Formularz zgłoszeniowy -->
    <form id="proStylistkaForm" class="form-card" novalidate>
      <!-- Imię i nazwisko -->
      <div class="row-2">
        <div class="field">
          <label for="imie" class="field-label">Imię<span class="req">*</span></label>
          <input id="imie" name="imie" type="text" placeholder="Wpisz imię" required />
        </div>
        <div class="field">
          <label for="nazwisko" class="field-label">Nazwisko<span class="req">*</span></label>
          <input id="nazwisko" name="nazwisko" type="text" placeholder="Wpisz nazwisko" required />
        </div>
      </div>

      <!-- Telefon i adres e-mail -->
      <div class="row-2">
        <div class="field">
          <label for="telefon" class="field-label">Numer telefonu<span class="req">*</span></label>
          <input id="telefon" name="telefon" type="tel" placeholder="+48 000 000 000" required />
        </div>
        <div class="field">
          <label for="email" class="field-label">Adres e-mail<span class="req">*</span></label>
          <input id="email" name="email" type="email" placeholder="twoj@email.pl" required />
        </div>
      </div>

      <!-- Doświadczenie i dotychczasowe szkolenia -->
      <div class="field">
        <label for="szkolenia" class="field-label">Jakie szkolenia lub kursy ze stylizacji paznokci masz już za sobą?<span class="req">*</span></label>
        <textarea id="szkolenia" name="szkolenia" placeholder="Napisz krótko o swoich szkoleniach lub doświadczeniu..." required></textarea>
      </div>

      <!-- Dostęp do komputera i gotowość na praktykę -->
      <div class="field">
        <span class="field-label">Czy masz dostęp do komputera oraz czas i gotowość na regularną pracę i praktykę?<span class="req">*</span></span>
        <div class="options-box" role="radiogroup" aria-label="Czy masz dostęp do komputera oraz czas i gotowość na regularną pracę i praktykę?">
          <label class="option-item">
            <input type="radio" name="gotowosc" value="Tak — mam komputer i czas na regularną praktykę" required />
            <span>Tak — mam dostęp do komputera oraz czas i gotowość na regularną pracę i praktykę.</span>
          </label>
          <label class="option-item">
            <input type="radio" name="gotowosc" value="Mam komputer, muszę dopasować grafik" />
            <span>Mam dostęp do komputera, ale potrzebuję dopasować grafik pod regularną praktykę.</span>
          </label>
          <label class="option-item">
            <input type="radio" name="gotowosc" value="Nie mam obecnie warunków na regularną praktykę" />
            <span>Nie mam obecnie warunków lub czasu na regularną praktykę.</span>
          </label>
        </div>
      </div>

      <!-- Zgoda na kontakt -->
      <label class="consent-row">
        <input id="zgoda" name="zgoda" type="checkbox" required />
        <span>Wyrażam zgodę na kontakt w sprawie zapisu na listę oczekujących programu Pro Stylistka 2.0 prowadzonego przez AP Studio.</span>
      </label>

      <!-- Komunikat dla użytkownika -->
      <div id="formStatus" class="notice" role="status" aria-live="polite"></div>

      <!-- Przycisk zapisu -->
      <button type="submit" id="submitBtn" class="submit-btn">ZAPISZ MNIE NA LISTĘ OCZEKUJĄCYCH</button>
    </form>
  </main>

  <script>
    (function () {
      // Adres endpointu Formspree obsługujący zgłoszenia na skrzynkę odbiorczą
      var ENDPOINT_URL = 'https://formspree.io/f/mgakprka';
      var form = document.getElementById('proStylistkaForm');
      var statusBox = document.getElementById('formStatus');
      var submitBtn = document.getElementById('submitBtn');
      if (!form || !statusBox || !submitBtn) return;

      /**
       * Wyświetla komunikat statusu w dedykowanym boksie pod formularzem.
       * @param {string} message - Treść komunikatu w języku polskim.
       */
      function showStatus(message) {
        statusBox.textContent = message;
        statusBox.classList.add('show');
      }

      form.addEventListener('submit', function (event) {
        event.preventDefault();

        try {
          var imie = document.getElementById('imie').value.trim();
          var nazwisko = document.getElementById('nazwisko').value.trim();
          var telefon = document.getElementById('telefon').value.trim();
          var email = document.getElementById('email').value.trim();
          var szkolenia = document.getElementById('szkolenia').value.trim();
          var gotowosc = form.querySelector('input[name="gotowosc"]:checked');
          var zgoda = document.getElementById('zgoda').checked;

          // Walidacja kompletności wymaganych pól oraz zgody
          if (!imie || !nazwisko || !telefon || !email || !szkolenia || !gotowosc || !zgoda) {
            showStatus('Uzupełnij wszystkie wymagane pola oraz zaznacz zgodę na kontakt.');
            return;
          }

          // Walidacja podstawowego formatu adresu e-mail
          if (email.indexOf('@') === -1 || email.indexOf('.') === -1) {
            showStatus('Podaj poprawny adres e-mail.');
            return;
          }

          submitBtn.disabled = true;
          showStatus('Wysyłanie zgłoszenia...');

          var payload = {
            imie: imie,
            nazwisko: nazwisko,
            telefon: telefon,
            email: email,
            szkolenia: szkolenia,
            gotowosc: gotowosc.value,
            zgoda: 'Tak'
          };

          fetch(ENDPOINT_URL, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Accept': 'application/json'
            },
            body: JSON.stringify(payload)
          })
            .then(function (response) {
              if (!response.ok) {
                throw new Error('Błąd wysyłki zgłoszenia');
              }
              showStatus(
                'Dziękujemy, ' +
                  imie +
                  ' ' +
                  nazwisko +
                  '. Zgłoszenie na listę oczekujących Pro Stylistka 2.0 zostało wysłane.'
              );
              form.reset();
            })
            .catch(function () {
              showStatus(
                'Nie udało się wysłać zgłoszenia. Spróbuj ponownie za chwilę lub sprawdź konfigurację adresu odbiorczego.'
              );
            })
            .finally(function () {
              submitBtn.disabled = false;
            });
        } catch (err) {
          submitBtn.disabled = false;
          showStatus(
            'Nie udało się wysłać zgłoszenia. Spróbuj ponownie za chwilę lub sprawdź konfigurację adresu odbiorczego.'
          );
        }
      });
    })();
  </script>
</body>
</html>
